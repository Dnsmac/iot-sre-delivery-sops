services:
  pulsar:
    image: apachepulsar/pulsar:3.2.3
    container_name: pulsar-standalone
    ports:
      - "6650:6650"
      - "8080:8080"
    command: bin/pulsar standalone
    healthcheck:
      test: ["CMD", "bin/pulsar-admin", "brokers", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
